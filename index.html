<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Kit</title>
    <style>
        :root {
            --bg: #090d16;
            --surface: #131a26;
            --border: #1e293b;
            --text: #ffffff;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --btn-num: #222d3d;
            --btn-op: #f59e0b;
            --btn-clear: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 480px; width: 100%; display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        h1 { text-align: center; font-size: 2rem; margin-bottom: 5px; }
        h1 span { color: var(--accent); }
        .tagline { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
        .card h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--text-muted); border-bottom: 1px solid var(--border); padding-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .display { width: 100%; height: 70px; background: #000; border: 1px solid var(--border); border-radius: 12px; color: #22c55e; font-family: monospace; font-size: 2rem; text-align: right; padding: 15px; margin-bottom: 15px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { height: 60px; font-size: 1.4rem; font-weight: 600; border: none; border-radius: 12px; background: var(--btn-num); color: var(--text); cursor: pointer; transition: opacity 0.1s; }
        button:active { opacity: 0.7; }
        button.op { background: var(--btn-op); }
        button.clear { background: var(--btn-clear); }
        button.equal { background: var(--accent); grid-column: span 2; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        .row { display: flex; gap: 10px; }
        input { width: 100%; height: 48px; background: #000; border: 1px solid var(--border); border-radius: 10px; color: #fff; padding: 0 12px; font-size: 1rem; outline: none; }
        input:focus { border-color: var(--accent); }
        .btn-submit { width: 100%; height: 48px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 5px; }
        .result { margin-top: 12px; padding: 12px; background: #000; border-radius: 8px; border-left: 4px solid var(--accent); font-size: 1rem; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Math<span>Kit</span></h1>
        <p class="tagline">Calculator, Percentages &amp; Hypotenuse</p>

        <!-- Calculator -->
        <div class="card">
            <h2>Calculator</h2>
            <input type="text" class="display" id="calc-screen" value="0" readonly>
            <div class="grid">
                <button class="clear" onclick="pressClear()">AC</button>
                <button onclick="press('(')">(</button>
                <button onclick="press(')')">)</button>
                <button class="op" onclick="press('/')">÷</button>

                <button onclick="press('7')">7</button>
                <button onclick="press('8')">8</button>
                <button onclick="press('9')">9</button>
                <button class="op" onclick="press('*')">×</button>

                <button onclick="press('4')">4</button>
                <button onclick="press('5')">5</button>
                <button onclick="press('6')">6</button>
                <button class="op" onclick="press('-')">−</button>

                <button onclick="press('1')">1</button>
                <button onclick="press('2')">2</button>
                <button onclick="press('3')">3</button>
                <button class="op" onclick="press('+')">+</button>

                <button onclick="press('0')">0</button>
                <button onclick="press('.')">.</button>
                <button class="equal" onclick="pressEqual()">=</button>
            </div>
        </div>

        <!-- Percentage Section -->
        <div class="card">
            <h2>Percentage</h2>
            <div class="form-group">
                <label>Find percentage of a number</label>
                <div class="row">
                    <input type="number" id="pct-rate" placeholder="Percentage %">
                    <input type="number" id="pct-total" placeholder="Of number">
                </div>
            </div>
            <button class="btn-submit" onclick="calcPercentage()">Calculate</button>
            <div class="result" id="pct-result"></div>
        </div>

        <!-- Hypotenuse Section -->
        <div class="card">
            <h2>Hypotenuse</h2>
            <div class="form-group">
                <label>Pythagorean theorem (c = √(a² + b²))</label>
                <div class="row">
                    <input type="number" id="side-a" placeholder="Side a">
                    <input type="number" id="side-b" placeholder="Side b">
                </div>
            </div>
            <button class="btn-submit" onclick="calcHypotenuse()">Calculate Side c</button>
            <div class="result" id="hyp-result"></div>
        </div>
    </div>

    <script>
        const screen = document.getElementById('calc-screen');

        function press(val) {
            if (screen.value === '0' && val !== '.') {
                screen.value = val;
            } else {
                screen.value += val;
            }
        }

        function pressClear() {
            screen.value = '0';
        }

        function pressEqual() {
            try {
                let res = eval(screen.value);
                screen.value = Number(res.toFixed(8));
            } catch (e) {
                screen.value = 'Error';
            }
        }

        function calcPercentage() {
            const rate = parseFloat(document.getElementById('pct-rate').value);
            const total = parseFloat(document.getElementById('pct-total').value);
            const box = document.getElementById('pct-result');
            if (isNaN(rate) || isNaN(total)) return;
            box.innerText = `${rate}% of ${total} = ${(rate / 100) * total}`;
            box.style.display = 'block';
        }

        function calcHypotenuse() {
            const a = parseFloat(document.getElementById('side-a').value);
            const b = parseFloat(document.getElementById('side-b').value);
            const box = document.getElementById('hyp-result');
            if (isNaN(a) || isNaN(b) || a <= 0 || b <= 0) return;
            box.innerText = `Hypotenuse c = ${Math.sqrt(a*a + b*b).toFixed(4)}`;
            box.style.display = 'block';
        }
    </script>
</body>
</html>
